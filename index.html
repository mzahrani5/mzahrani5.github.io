/* Layout: register book — sticky ledger header, horizontal section tabs, roster rows as the core surface */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e8ece7; --ink:#17231e; --muted:#5b6a63; --line:#d6ded8;
  --accent:#1c6a59; --accent-ink:#ffffff; --accent-soft:#deeee8;
  --gold:#a8701a; --gold-soft:#f6ead3;
  --ok:#2c7a4c; --ok-soft:#dcefe3; --warn:#a96400; --warn-soft:#f7e8cf; --bad:#b0352d; --bad-soft:#f6dcd9; --info:#36609f; --info-soft:#dfe7f4;
  --f-display:"HelveticaNeueLT",Tahoma,"Segoe UI",sans-serif;
  --f-body:"HelveticaNeueLT",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161f1b; --sunk:#111916; --ink:#e5ece8; --muted:#97a69f; --line:#29352f;
  --accent:#55b79d; --accent-ink:#08120f; --accent-soft:#19302a;
  --gold:#e3ab4f; --gold-soft:#33291a;
  --ok:#63c48f; --ok-soft:#173326; --warn:#e3a443; --warn-soft:#352816; --bad:#e8786e; --bad-soft:#3a1d1a; --info:#86a6e6; --info-soft:#1b2640;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161f1b; --sunk:#111916; --ink:#e5ece8; --muted:#97a69f; --line:#29352f;
  --accent:#55b79d; --accent-ink:#08120f; --accent-soft:#19302a;
  --gold:#e3ab4f; --gold-soft:#33291a;
  --ok:#63c48f; --ok-soft:#173326; --warn:#e3a443; --warn-soft:#352816; --bad:#e8786e; --bad-soft:#3a1d1a; --info:#86a6e6; --info-soft:#1b2640;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
button.chip{border:0;cursor:pointer}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;line-height:1.3;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-pick{display:flex;align-items:center;gap:8px}
.cls-pick label{font-size:.8rem;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{width:100%;min-height:96px;resize:vertical}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{padding-block:20px 60px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-family:var(--f-display);font-weight:500;font-size:1.4rem;margin:0}
.sec-head .sub{color:var(--muted);font-size:.85rem;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.hijri{font-size:.8rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.warnline{font-size:.85rem;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--sunk);font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-info{background:var(--info-soft);color:var(--info)} .c-gold{background:var(--gold-soft);color:var(--gold)}
/* roster */
.roster{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.r-item:first-child{border-top:0}
.r-num{width:26px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;flex:none}
.r-name{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);min-width:44px;min-height:36px;padding:0 8px;font-size:.82rem;font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on.s-p{background:var(--ok-soft);color:var(--ok)}
.seg button.on.s-a{background:var(--bad-soft);color:var(--bad)}
.seg button.on.s-l{background:var(--warn-soft);color:var(--warn)}
.seg button.on.s-e{background:var(--info-soft);color:var(--info)}
@media (max-width:520px){.r-item{flex-wrap:wrap}.r-item .seg{width:100%}.seg button{flex:1}}
/* grid tables */
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.grid{border-collapse:collapse;width:100%;font-size:.88rem}
table.grid th,table.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.grid th{background:var(--sunk);font-weight:600;font-size:.8rem;color:var(--muted);position:sticky;top:0}
table.grid td.nm,table.grid th.nm{text-align:right;position:sticky;right:0;background:var(--surface);z-index:1;min-width:140px;white-space:normal}

/* list of items (lessons, homework) */
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}

.pick .m{font-size:.75rem;color:var(--muted);display:block}

.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:60px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}

/* settings */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

legend{padding:0 6px;font-weight:600;font-size:.9rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}

/* student detail */
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:60}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

/* print preview: paper keeps fixed paper colors in both themes */
:root{--paper:#ffffff;--p-ink:#17231e;--p-muted:#5b6a63;--p-line:#cfd8d2;--p-head:#e9efeb;--p-acc:#1c6a59;--p-gold:#a8701a;--p-gold-soft:#f6ead3;--p-ok:#2c7a4c;--p-ok-bg:#dcefe3;--p-bad:#b0352d;--p-bad-bg:#f6dcd9;--p-warn:#a96400;--p-warn-bg:#f7e8cf;--p-info:#36609f;--p-info-bg:#dfe7f4;--p-scrim:#5d6964}

/* plan */

// ---------- storage: private db per teacher, local mirror ----------
const store={mode:"local",db:null,base:null,timers:{},queue:{},busy:{},
  local(){try{const raw=localStorage.getItem("cr_data");if(raw){const d=JSON.parse(raw);return d}}catch(e){}return null},
  mirror(){try{localStorage.setItem("cr_data",JSON.stringify(S))}catch(e){}},
  docs(){const out={settings:S.settings};for(const id in S.classes){out["c_"+id]=S.classes[id];out["a_"+id]=S.att[id]||{rec:{}}}return out},
  touch(key){ // key: settings | c_<id> | a_<id>
    this.mirror();
    if(this.mode!=="db")return;
    clearTimeout(this.timers[key]);
    this.timers[key]=setTimeout(()=>this.flush(key),600);
  },
  async flush(key){
    if(this.busy[key]){this.queue[key]=true;return}
    this.busy[key]=true;
    try{
      const ref=this.db.doc(this.base+"/"+key);
      let body=null;
      if(key==="settings")body=S.settings;
      else if(key.startsWith("c_"))body=S.classes[key.slice(2)];
      else if(key.startsWith("a_"))body=S.att[key.slice(2)];
      if(body)await ref.set(JSON.parse(JSON.stringify(body)));else await ref.delete();
    }catch(e){toast("تعذّر الحفظ في السحابة، والبيانات محفوظة في هذا المتصفح")}
    this.busy[key]=false;
    if(this.queue[key]){this.queue[key]=false;this.flush(key)}
  },
  async connect(){
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db||!user)return;
      const id=await user.id(); if(!id)return;
      this.db=db;this.base="data/users/"+id;
      const snap=await db.collection(this.base).get();
      this.mode="db";
      if(snap.empty){ // first time on this account: push whatever this browser has
        const d=this.docs();for(const k in d)this.flush(k);
      }else{
        const next={settings:{...DEFAULT_SETTINGS},classes:{},att:{}};
        snap.docs.forEach(doc=>{const b=doc.data()||{};
          if(doc.id==="settings")next.settings={...DEFAULT_SETTINGS,...b};
          else if(doc.id.startsWith("c_"))next.classes[doc.id.slice(2)]=JSON.parse(JSON.stringify(b));
          else if(doc.id.startsWith("a_"))next.att[doc.id.slice(2)]=JSON.parse(JSON.stringify(b));
        });
        S=next;this.mirror();
      }
      render();
    }catch(e){}
  }
};

function studentStats(c,sid){
  const recs=A(c.id).rec;let p=0,a=0,l=0,e=0,absDates=[],lateDates=[];
  Object.keys(recs).sort().forEach(k=>{const v=recs[k][sid];if(!v)return;
    if(v==="p")p++;else if(v==="a"){a++;absDates.push(k)}else if(v==="l"){l++;lateDates.push(k)}else if(v==="e")e++;});
  const sessions=p+a+l+e;
  const att=pct(p+l,sessions-e);
  const skills=allSkills(c).filter(s=>lessonTaught(c,s.lesson));const marks=c.skillMarks[sid]||{};const projs=c.proj.filter(pp=>projActive(c,pp));
  let m2=0,m1=0,m0=0;skills.forEach(s=>{const v=marks[s.id];if(v===2)m2++;else if(v===1)m1++;else if(v===0)m0++;});
  const mastery=pct(m2,skills.length);
  let hd=0,hl=0;c.hw.forEach(h=>{const v=(c.hwMarks[h.id]||{})[sid];if(v==="d")hd++;else if(v==="l")hl++;});
  const hwP=pct(hd+hl,c.hw.length);
  let pd=0,pScore=0,pMax=0;projs.forEach(pr=>{const v=((c.projMarks[pr.id]||{})[sid])||{};if(v.s==="d"||v.s==="l")pd++;if(v.score!=null&&v.score!==""){pScore+=Number(v.score);pMax+=Number(pr.max||0)}});
  const projP=pct(pd,projs.length);
  const st=S.settings;
  const okAtt=sessions===0||(att!=null&&att>=Number(st.minAtt||0));
  const okSkill=skills.length===0||(mastery!=null&&mastery>=Number(st.minSkill||0));
  const okHw=!st.reqHw||c.hw.length===0||(hd+hl)===c.hw.length;
  const okProj=!st.reqProj||projs.length===0||pd>=projs.length;
  const hasWork=skills.length+c.hw.length+projs.length>0;
  return {p,a,l,e,sessions,att,absDates,lateDates,m2,m1,m0,skillsN:skills.length,mastery,hd,hl,hwN:c.hw.length,hwP,pd,projN:projs.length,projP,pScore,pMax,
    excellent:hasWork&&okAtt&&okSkill&&okHw&&okProj};
}

// ---------- Fixed period schedule ----------
const PN=["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة"];
const fmtTime=t=>{if(!t)return "";const [h,m]=t.split(":").map(Number);const h12=((h+11)%12)+1;return AR(h12)+":"+AR(String(m).padStart(2,"0"))+(h<12?" ص":" م")};
function schedP(c,dow){const s=(c.sched||{})[dow];if(!s)return null;if(s.p)return s.p;if(s.t){const i=(S.settings.bell||[]).indexOf(s.t);if(i>=0)return i+1}return null}
function syncPeriod(c){const k=c.id+"|"+ui.date;if(ui.periodKey===k)return;ui.periodKey=k;const p=schedP(c,toDate(ui.date).getDay());if(p)ui.period=p}
function schedLine(c){const sc=c.sched||{};const ds=c.days.filter(d=>schedP(c,d));if(!ds.length)return `<p class="note" style="margin:8px 0 0">اختر الحصة ثم اضغط «تثبيت» لتُختار تلقائياً كل ${esc(c.days.map(d=>DAYS[d]).join(" و"))} طوال الفصل.</p>`;
  return `<div class="chips sched" style="margin-top:10px"><span class="note">الحصص المثبّتة:</span>${ds.map(d=>{const pp=schedP(c,d);const t=timeOf(c,d,pp);return `<span class="chip c-info">${DAYS[d]}: الحصة ${PN[pp-1]}${t?" · "+esc(fmtTime(t)):""}</span>`}).join("")}<button class="btn small ghost" data-act="editClass" data-id="${c.id}">تعديل الجدول</button></div>`}
// ---------- Today's periods (bell schedule) ----------
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tMin=t=>{if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m};
function timeOf(c,dow,p){const s=(c.sched||{})[dow];return (s&&s.t&&(s.p===p||(!s.p&&schedP(c,dow)===p))&&s.t)||((S.settings.bell||[])[p-1])||""}
function daySlots(date){const dow=toDate(date).getDay();const out=[];const L=Number(S.settings.plen)||45;const today=date===isoToday();const nm=nowMin();
  classList().forEach(c=>{if(!c.days.includes(dow))return;const s=(c.sched||{})[dow];const p=schedP(c,dow);
    const t=p?timeOf(c,dow,p):(s&&s.t)||"";const st=tMin(t);const rec=p?(A(c.id).rec[date+"_"+p]||{}):{};const n=Object.keys(rec).length;
    let phase="";if(today&&st!=null){phase=nm<st?"soon":nm<st+L?"now":"past"}
    out.push({c,p,t,n,total:c.students.length,phase,live:phase==="now"})});
  out.sort((a,b)=>(a.p||99)-(b.p||99)||(a.c.created||0)-(b.c.created||0));return out}
function currentSlot(){const nm=nowMin();const sl=daySlots(isoToday()).filter(x=>x.p&&x.t);return sl.find(x=>x.live)||sl.find(x=>{const st=tMin(x.t);return st>nm&&st-nm<=5})||null}
function switchToSlot(x,announce){const changed=ui.cls!==x.c.id;ui.cls=x.c.id;ui.lesson=ui.hw=ui.proj=null;
  if(ui.tab==="att"||announce){ui.date=isoToday();ui.period=x.p;ui.periodKey=x.c.id+"|"+ui.date}
  saveUI();render();if(announce&&changed)toast("السجل الآن على "+x.c.name+" · الحصة "+PN[x.p-1])}
function liveSlot(){return daySlots(isoToday()).find(x=>x.live&&x.p)||null}
function autoPickNow(){if(ui.date!==isoToday())return;const sl=daySlots(ui.date).filter(x=>x.p);if(!sl.length)return;
  const pick=sl.find(x=>x.live)||sl.find(x=>x.phase==="soon"&&x.n<x.total)||sl.filter(x=>x.phase==="past"&&x.n<x.total).pop();
  if(pick){ui.cls=pick.c.id;ui.period=pick.p;ui.periodKey=pick.c.id+"|"+ui.date;saveUI()}}
function slotsBar(){
  const sl=daySlots(ui.date);const dow=toDate(ui.date).getDay();
  if(!sl.length)return `<div class="slots empty-s"><span class="note">لا توجد حصص مجدولة يوم ${DAYS[dow]} في جداول فصولك.</span></div>`;

  <div class="slot-row">${sl.map(x=>{const sel=x.c.id===ui.cls&&x.p===ui.period;const done=x.p&&x.n>=x.total&&x.total>0;
    const badge=x.live?'<em class="b-now">الآن</em>':done?'<em class="b-ok">✓ حُضّرت</em>':x.n?`<em class="b-part">${AR(x.n)}/${AR(x.total)}</em>`:x.phase==="soon"?'<em class="b-soon">قادمة</em>':x.p?'<em class="b-no">لم تُحضَّر</em>':'<em class="b-no">غير مثبّتة</em>';
    return `<button class="slot ${sel?"sel":""} ${x.live?"live":""}" data-slot="${x.c.id}|${x.p||""}" aria-pressed="${sel}">
      <span class="s-t">${x.t?esc(fmtTime(x.t)):x.p?"الحصة "+PN[x.p-1]:"—"}</span><b>${esc(x.c.name)}</b><span class="s-p">${x.p?"الحصة "+PN[x.p-1]:"حدد الحصة"}</span>${badge}</button>`}).join("")}</div></div>`}

  v.innerHTML=`
  <div class="sec-head"><div><h2>الحضور اليومي</h2><p class="sub">${esc(c.name)} · ${c.ppw} حصص أسبوعياً</p></div>

  ${slotsBar()}

function parseCurText(t){const out=[];let u=0,ut="";
  t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m=/^(#+|الوحدة|وحدة)\s*(.*)$/.exec(line);
    if(m){u++;ut=m[1].startsWith("#")?m[2]:line.replace(/^(الوحدة|وحدة)\s*[^:：\-–]*[:：\-–]?\s*/,"")||line;return}
    const [title,sk]=line.split(/[:：]/);const name=title.replace(/^[\d٠-٩]+[.\-)]\s*/,"").trim();if(!name)return;
    out.push({title:name,unit:u||null,unitTitle:u?ut:"",skills:(sk||"").split(/[،,؛;]/).map(x=>x.trim()).filter(Boolean)})});
  return out}
function parseCurRows(rows){const out=[];const units=[];let lastU="";
  rows.forEach((r,i)=>{r=r.map(x=>String(x==null?"":x).trim());if(!r.some(Boolean))return;if(i===0&&r.join(" ").includes("الدرس"))return;
    let [uu,title,sk]=r;if(!title){title=uu;uu=lastU}if(!title)return;uu=uu||lastU;lastU=uu;
    let n=0;if(uu){if(!units.includes(uu))units.push(uu);n=units.indexOf(uu)+1}
    out.push({title,unit:n||null,unitTitle:uu?String(uu).replace(/^(الوحدة|وحدة)\s*[^:：\-–]*[:：\-–]\s*/,""):"",skills:(sk||"").split(/[،,؛;\n]/).map(x=>x.trim()).filter(Boolean)})});

// ---------- sheets ----------
function sheet(html,onMount){
  const L=$("#layer");L.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
  if(onMount)onMount(L.querySelector(".sheet"));
  const f=L.querySelector("input[type=text],textarea");if(f)setTimeout(()=>f.focus(),50);
}
function closeSheet(){$("#layer").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function confirmSheet(title,text,btn,fn){
  sheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="actions"><button class="btn danger solid" id="cfOk">${esc(btn)}</button><button class="btn" data-act="close">إلغاء</button></div>`,
    el=>el.querySelector("#cfOk").addEventListener("click",()=>{closeSheet();fn()}));
}

async function saveFile(filename,data,type){
  const LOCAL=!window.claude||!window.claude.use;

      const p={id:nid(),title:String(t),due:xlDate(cellV(pj,2,col)),max:Number(norm(cellV(pj,1,col)))||0};c.proj.push(p);const mk=c.projMarks[p.id]={};
      rows.forEach(r=>{const s=HW_IN[norm(cellV(pj,r,col))];const g=cellV(pj,r,col+1);const o={};if(s)o.s=s;if(g!=null&&!isNaN(Number(norm(g))))o.score=Number(norm(g));if(o.s||o.score!=null)mk[rowSid[r]]=o})}}
    res.classes.push({c,att:{rec}});
  });
  return res;
}

async function readWorkbookFile(file){
  const XLSX=await SheetLib();
  const buf=await file.arrayBuffer();
  return XLSX.read(new Uint8Array(buf),{type:"array",cellDates:false});
}

function importStudentsSheet(){

    let wb=null,names=[];

        if(n.length<3||/^\d+$/.test(k)||k.includes("اسم الطالب"))continue;if(have.has(k)||seen.has(k)){dup++;continue}seen.add(k);names.push(n)}

        :"لم أجد أسماء في هذا العمود. اختر عموداً آخر أو عدّل صف البداية.";
      go.disabled=!names.length}

      el.querySelector("#sfCol").addEventListener("change",collect);el.querySelector("#sfStart").addEventListener("input",collect);collect()}
    el.querySelector("#sfFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;out.textContent="جارٍ قراءة الملف…";opts.innerHTML="";go.disabled=true;

        el.querySelector("#sfSheet").addEventListener("change",setSheet);setSheet()}
      catch(err){out.textContent=String(err&&err.message)==="lib"?"تعذّر تحميل قارئ Excel. تحقق من الاتصال بالإنترنت وحاول مجدداً.":"تعذّرت قراءة الملف. جرّب حفظه بصيغة .xlsx أو .csv."}});
    go.addEventListener("click",()=>{names.forEach(n=>c.students.push({id:nid(),name:n}));store.touch("c_"+c.id);closeSheet();render();toast("أُضيف "+names.length+" طالباً من الملف")});

function chunkRows(arr,first,rest){if(!arr.length)return [[]];const out=[arr.slice(0,first)];for(let i=first;i<arr.length;i+=rest)out.push(arr.slice(i,i+rest));return out}

// grouped header table: cols=[{g:"group label",head:"html",cls}] ; returns <thead>
function groupedHead(lead,cols,tail){
  const groups=[];cols.forEach(c=>{const last=groups[groups.length-1];if(last&&last.g===c.g)last.n++;else groups.push({g:c.g,n:1})});
  const hasG=cols.some(c=>c.g);

function unitsTaught(c){const map=new Map();c.lessons.forEach(l=>{if(!lessonTaught(c,l)||!l.skills.length)return;const k=l.unit?("الوحدة "+AR(l.unit)):"دروس أخرى";if(!map.has(k))map.set(k,[]);map.get(k).push(l)});return [...map.entries()]}
function pagesClass(c){

  const avg=k=>{const v=rows.map(r=>r.x[k]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};

  return ch.map((part,k)=>({o:"l",html:pgHead(c,"كشف متابعة الطلاب")+(k===0?strip:"")+

      ${um.map(v=>`<td class="num ${pCls(v)}">${pP(v)}</td>`).join("")}<td class="num sumc ${pCls(x.mastery)}">${pP(x.mastery)}</td>
      <td class="num">${AR(x.hd+x.hl)}/${AR(x.hwN)}</td><td class="num">${AR(x.pd)}/${AR(x.projN)}</td><td>${x.excellent?'<b class="t-gold">★ متميّز</b>':""}</td><td></td></tr>`).join("")||`<tr><td colspan="12">لا يوجد طلاب</td></tr>`}</tbody></table>`+
    (k===ch.length-1?`<p class="pg-note">معيار التميّز: حضور ${AR(S.settings.minAtt)}٪ فأكثر، وإتقان ${AR(S.settings.minSkill)}٪ من مهارات الدروس المنفّذة${S.settings.reqHw?"، وتسليم جميع الواجبات":""}${S.settings.reqProj?"، وتسليم المشاريع المطلوبة":""}.</p>`+pgSign():"")}));

// generic grid
function gridPages(c,title,cols,cellFn,sumHeads,sumFn,opts){
  opts=opts||{};
  if(!cols.length)return [{o:"l",html:pgHead(c,title)+`<p class="pg-empty">${opts.empty||"لا توجد بيانات"}</p>`}];
  const out=[];const per=opts.per||16;const rowCh=chunkN(c.students.map((s,i)=>({s,i})),opts.rows||17);
  const colCh=chunkN(cols,per);
  colCh.forEach((cc,ci)=>rowCh.forEach((rr,ri)=>{
    const last=ri===rowCh.length-1;
    const extra=colCh.length>1?[["الجزء",AR(ci+1)+" من "+AR(colCh.length)]]:[];
    out.push({o:"l",html:pgHead(c,title,(opts.info||[]).concat(extra))+`<table class="pg-t pg-grid">${groupedHead([["م","w-n"],["اسم الطالب","nm w-name"]],cc,sumHeads)}
      <tbody>${rr.map(({s,i})=>`<tr><td class="num">${AR(i+1)}</td><td class="nm">${esc(s.name)}</td>${cc.map(x=>cellFn(s,x)).join("")}${sumFn(s)}</tr>`).join("")||`<tr><td colspan="${cc.length+2+sumHeads.length}">لا يوجد طلاب</td></tr>`}</tbody>
      ${last&&opts.foot?`<tfoot><tr><td colspan="2" class="nm">${opts.foot[0]}</td>${cc.map(x=>`<td class="num">${opts.foot[1](x)}</td>`).join("")}${sumHeads.map(()=>"<td></td>").join("")}</tr></tfoot>`:""}</table>`+
      (opts.legend||"")+(last&&ci===colCh.length-1?(opts.after||"")+pgSign():"")});
  }));
  return out;
}

async function pagesToPdf(pages,name,progress){
  let h2c,jsp;
  try{[h2c,jsp]=await Promise.all([H2C(),JSPDF()])}catch(e){toast("تعذّر تحميل أداة PDF. تحقق من الاتصال وحاول مجدداً");return}
  const host=document.createElement("div");host.className="pg-host";document.body.appendChild(host);
  try{
    try{await document.fonts.ready}catch(e){}
    let doc=null;
    for(let i=0;i<pages.length;i++){
      const p=pages[i];if(progress)progress(i+1,pages.length);
      host.innerHTML=`<div class="pg pg-${p.o}">${p.html}</div>`;const el=host.firstChild;
      const cv=await h2c(el,{scale:2,backgroundColor:"#ffffff",logging:false,windowWidth:el.offsetWidth+40});
      const land=p.o==="l",W=land?297:210,H=land?210:297,orient=land?"landscape":"portrait";
      if(!doc)doc=new jsp.jsPDF({orientation:orient,unit:"mm",format:"a4",compress:true});else doc.addPage("a4",orient);
      const per=Math.floor(cv.width*H/W);let y=0,first=true;
      while(y<cv.height-4){if(!first)doc.addPage("a4",orient);const h=Math.min(per,cv.height-y);
        const sc=document.createElement("canvas");sc.width=cv.width;sc.height=h;const g=sc.getContext("2d");g.fillStyle="#ffffff";g.fillRect(0,0,sc.width,h);g.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
        doc.addImage(sc.toDataURL("image/jpeg",0.92),"JPEG",0,0,W,h*W/cv.width);y+=h;first=false}
    }
    await saveFile(name,doc.output("blob"),"application/pdf");
  }catch(e){toast("تعذّر إنشاء ملف PDF")}
  host.remove();
}

  if(x&&!busy){const sx=scrollY;switchToSlot(x,true);scrollTo(0,sx)}else renderShell()},30000);
})();
